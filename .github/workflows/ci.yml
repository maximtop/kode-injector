name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect native changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            DIFF_RANGE="$BASE_SHA...$HEAD_SHA"
          else
            DIFF_RANGE="$BASE_SHA..$HEAD_SHA"
          fi

          set +e
          git diff --quiet "$DIFF_RANGE" -- \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            native-host/ \
            scripts/native-host/ \
            src/app/common/native-host-artifacts.ts \
            src/app/common/native-host-protocol.ts \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.json
          DIFF_STATUS=$?
          set -e

          case "$DIFF_STATUS" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$DIFF_STATUS" ;;
          esac

  extension:
    name: Check and build extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: pnpm check
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Build release extensions
        run: pnpm release
      - name: Verify built manifests
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(jq -er '.version' package.json)"
          for BROWSER in chrome edge firefox; do
            MANIFEST="build/release/$BROWSER/manifest.json"
            BUILT_VERSION="$(jq -er '.version' "$MANIFEST")"
            if [[ "$BUILT_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "$MANIFEST version $BUILT_VERSION != package.json $PACKAGE_VERSION" >&2
              exit 1
            fi
            test -f "build/release/$BROWSER.zip"
          done
      - name: Retain extension archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-archives
          path: |
            build/release/chrome.zip
            build/release/edge.zip
            build/release/firefox.zip
          if-no-files-found: error
          retention-days: 14

  native:
    name: Test native host
    needs: native-changes
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: native-host/go.sum
      - name: Run native-host tests
        working-directory: native-host
        run: go test -race ./...

  macos-helper:
    name: Test macOS helper
    needs: native-changes
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: native-host/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate macOS helper packages
        run: pnpm native:macos:validate

  safari:
    name: Build and validate Safari app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: native-host/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate Safari app
        run: pnpm safari:validate
      - name: Build and validate unsigned App Store archive
        run: pnpm safari:store:check
