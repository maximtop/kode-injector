name: Start release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version (X.Y.Z). Bumps package.json on master, tags it, and starts the Release workflow.'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: start-release
  cancel-in-progress: false

jobs:
  start:
    name: Bump, tag, and start Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Bump package.json
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          EXISTING_TAGS="$(git tag -l)" scripts/release/prepare-release.sh

      - name: Commit to master, tag, and start the Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump version to $VERSION"
          git push origin HEAD:master
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          # A tag pushed with GITHUB_TOKEN does not fire the Release
          # workflow's tag trigger, so start it explicitly on the new tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "::notice::Pushed $(git rev-parse --short HEAD) to master, created $TAG, and started the Release workflow."
