name: Deploy Microsoft Edge Add-ons

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to deploy (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Upload and submit for certification
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: edge-addons-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GO_WEBEXT_VERSION: v0.4.2
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Resolve and validate release
        id: release
        uses: ./.github/actions/resolve-store-release
        with:
          event-name: ${{ github.event_name }}
          event-tag: ${{ github.event.release.tag_name }}
          input-tag: ${{ inputs.tag }}

      - name: Check store configuration
        if: steps.release.outputs.deploy == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing store configuration: ${missing[*]}" >&2
            echo "Complete the initial Partner Center publication, then" \
              "set the variable and secrets listed in DEVELOPMENT.md." >&2
            exit 1
          fi

      - name: Download release assets
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern edge.zip \
            --pattern SHA256SUMS \
            --dir release-assets

      - name: Verify asset integrity and version
        if: steps.release.outputs.deploy == 'true'
        working-directory: release-assets
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          grep ' edge\.zip$' SHA256SUMS | sha256sum --check --strict -
          ZIP_VERSION="$(unzip -p edge.zip manifest.json | jq -r '.version')"
          if [[ "$ZIP_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "edge.zip manifest version $ZIP_VERSION does not match" \
              "release version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Set up go-webext
        if: steps.release.outputs.deploy == 'true'
        uses: ./.github/actions/setup-go-webext
        with:
          version: ${{ env.GO_WEBEXT_VERSION }}

      - name: Upload to Microsoft Edge Add-ons
        if: steps.release.outputs.deploy == 'true'
        env:
          EDGE_API_VERSION: v1.1
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          # go-webext returns only after package processing reaches Succeeded.
          go-webext update edge \
            -a "$EDGE_PRODUCT_ID" -f release-assets/edge.zip 2>&1 \
            | tee "$RUNNER_TEMP/upload-output.txt"

      - name: Submit for certification
        if: steps.release.outputs.deploy == 'true'
        id: publish
        env:
          EDGE_API_VERSION: v1.1
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          PUBLISH_OUTPUT="$RUNNER_TEMP/publish-output.txt"
          go-webext publish edge -a "$EDGE_PRODUCT_ID" 2>&1 \
            | tee "$PUBLISH_OUTPUT"

          # go-webext v0.4.2 checks the publish operation only once. A zero
          # exit with InProgress means the request was accepted and continues
          # asynchronously; it does not mean certification has completed.
          # v0.4.2 prints the response as an unlabeled Go struct, for example
          # &{... Succeeded ...}, so match the status as a whitespace-delimited
          # value rather than looking for a field label that is never printed.
          if grep -Eq '(^|[[:space:]])Succeeded([[:space:]]|$)' "$PUBLISH_OUTPUT"; then
            OPERATION_STATUS="Succeeded"
          elif grep -Eq '(^|[[:space:]])InProgress([[:space:]]|$)' "$PUBLISH_OUTPUT"; then
            OPERATION_STATUS="InProgress"
            echo "::notice::The Edge submission was accepted and is still processing."
          else
            OPERATION_STATUS="Accepted (immediate status was not recognized)"
            echo "::warning::The Edge submission was accepted, but its" \
              "immediate operation status was not recognized."
          fi
          echo "operation_status=$OPERATION_STATUS" >> "$GITHUB_OUTPUT"

      - name: Report deployment
        if: steps.release.outputs.deploy == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          OPERATION_STATUS: ${{ steps.publish.outputs.operation_status }}
        run: |
          set -euo pipefail
          {
            echo "## Microsoft Edge Add-ons deployment"
            echo
            echo "- Release: \`$RELEASE_TAG\` (version $PACKAGE_VERSION)"
            echo "- Package processing reached \`Succeeded\`."
            echo "- Submission request status: \`$OPERATION_STATUS\`."
            echo "- Certification and store publication continue" \
              "asynchronously in Partner Center."
            echo "- [Open the submission](https://partner.microsoft.com/en-us/dashboard/microsoftedge/$EDGE_PRODUCT_ID/packages/dashboard)."
            echo
            echo '```'
            head -c 8000 "$RUNNER_TEMP/publish-output.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
