name: Deploy Firefox Add-ons

on:
  workflow_call:
    inputs:
      tag:
        description: 'Published release tag to deploy (vX.Y.Z)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to deploy (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Upload and submit for review
    runs-on: ubuntu-latest
    # go-webext bounds the AMO validation wait at 20 minutes; this only
    # catches a run that hangs outside it.
    timeout-minutes: 30
    concurrency:
      group: firefox-amo-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GO_WEBEXT_VERSION: v0.4.2
      FIREFOX_EXTENSION_ID: kode-injector@maximtop.dev
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Resolve and validate release
        id: release
        uses: ./.github/actions/resolve-store-release
        with:
          event-name: ${{ github.event_name }}
          event-tag: ${{ github.event.release.tag_name }}
          input-tag: ${{ inputs.tag }}

      - name: Check store configuration
        if: steps.release.outputs.deploy == 'true'
        env:
          FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
          FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in FIREFOX_CLIENT_ID FIREFOX_CLIENT_SECRET; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing store configuration: ${missing[*]}" >&2
            echo "Set the secrets listed in DEVELOPMENT.md before" \
              "deploying." >&2
            exit 1
          fi

      - name: Download release assets
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern firefox.zip \
            --pattern source.zip \
            --pattern approval-notes.txt \
            --pattern SHA256SUMS \
            --dir release-assets

      - name: Verify asset integrity and version
        if: steps.release.outputs.deploy == 'true'
        working-directory: release-assets
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Refuse incomplete releases before anything reaches AMO. Without
          # this, go-webext would create the version and only then fail to
          # attach the missing source, leaving a half-submitted version
          # whose number is burned on the listing.
          for f in firefox.zip source.zip approval-notes.txt SHA256SUMS; do
            if [[ ! -f "$f" ]]; then
              echo "Release asset $f is missing. Releases published before" \
                "the AMO assets existed (v0.9.1 and older) cannot be" \
                "deployed by this workflow; submit them from the Developer" \
                "Hub instead." >&2
              exit 1
            fi
          done
          ASSET_LINES="$(grep -cE \
            ' (firefox\.zip|source\.zip|approval-notes\.txt)$' SHA256SUMS \
            || true)"
          if [[ "$ASSET_LINES" -ne 3 ]]; then
            echo "SHA256SUMS covers $ASSET_LINES of 3 AMO assets;" \
              "refusing to deploy an incompletely checksummed release" >&2
            exit 1
          fi
          grep -E ' (firefox\.zip|source\.zip|approval-notes\.txt)$' SHA256SUMS \
            | sha256sum --check --strict -
          ZIP_VERSION="$(unzip -p firefox.zip manifest.json | jq -r '.version')"
          if [[ "$ZIP_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "firefox.zip manifest version $ZIP_VERSION does not match" \
              "release version $PACKAGE_VERSION" >&2
            exit 1
          fi
          GECKO_ID="$(unzip -p firefox.zip manifest.json \
            | jq -r '.browser_specific_settings.gecko.id')"
          if [[ "$GECKO_ID" != "$FIREFOX_EXTENSION_ID" ]]; then
            echo "firefox.zip gecko id $GECKO_ID does not match" \
              "$FIREFOX_EXTENSION_ID" >&2
            exit 1
          fi

      - name: Set up go-webext
        if: steps.release.outputs.deploy == 'true'
        uses: ./.github/actions/setup-go-webext
        with:
          version: ${{ env.GO_WEBEXT_VERSION }}

      - name: Upload to Firefox Add-ons and attach source
        if: steps.release.outputs.deploy == 'true'
        env:
          FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
          FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # go-webext waits for AMO validation, attaches the source archive,
          # and returns. Mozilla's review and signing run asynchronously
          # afterwards; the version publishes itself once approved.
          go-webext update firefox \
            -f release-assets/firefox.zip \
            -s release-assets/source.zip \
            -c listed \
            -n "$(cat release-assets/approval-notes.txt)" 2>&1

      - name: Report store status
        if: steps.release.outputs.deploy == 'true'
        env:
          FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
          FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Diagnostics only. The version is already submitted at this point,
          # so a status failure must never turn a successful deploy red.
          STATUS_FILE="$RUNNER_TEMP/status-output.txt"
          STATUS_NOTE=""
          if ! go-webext status firefox -a "$FIREFOX_EXTENSION_ID" \
            > "$STATUS_FILE" 2>&1; then
            STATUS_NOTE="Reading the listing status failed; the version was still submitted. go-webext v0.4.2 cannot decode the AMO \`categories\` field, which the API now returns as an array."
            echo "::warning::$STATUS_NOTE"
          fi
          head -c 8000 "$STATUS_FILE" || true
          {
            echo "## Firefox Add-ons deployment"
            echo
            echo "- Release: \`$RELEASE_TAG\` (version $PACKAGE_VERSION)"
            echo "- Uploaded to the listed channel with the source archive" \
              "and submitted to the Mozilla review queue."
            echo "- Mozilla reviews and signs asynchronously (hours to" \
              "days); the version publishes automatically after approval," \
              "with no manual publish step."
            echo "- Track progress in the [Developer Hub](https://addons.mozilla.org/en-US/developers/addon/kode-injector/versions)."
            if [[ -n "$STATUS_NOTE" ]]; then
              echo "- $STATUS_NOTE"
            fi
            echo
            echo '```'
            head -c 8000 "$STATUS_FILE"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
