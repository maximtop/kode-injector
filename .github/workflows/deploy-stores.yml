name: Deploy stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to deploy (vX.Y.Z)'
        required: true
        type: string
      chrome:
        description: 'Chrome Web Store'
        type: boolean
        default: false
      firefox:
        description: 'Firefox Add-ons'
        type: boolean
        default: false
      edge:
        description: 'Microsoft Edge Add-ons'
        type: boolean
        default: false
      apple:
        description: 'Apple App Store Connect upload'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-stores
  cancel-in-progress: false

jobs:
  validate-selection:
    name: Validate store selection
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid tag and at least one store
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_CHROME: ${{ inputs.chrome }}
          DEPLOY_FIREFOX: ${{ inputs.firefox }}
          DEPLOY_EDGE: ${{ inputs.edge }}
          DEPLOY_APPLE: ${{ inputs.apple }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z: $TAG" >&2
            exit 1
          fi
          if [[ "$DEPLOY_CHROME" != true \
            && "$DEPLOY_FIREFOX" != true \
            && "$DEPLOY_EDGE" != true \
            && "$DEPLOY_APPLE" != true ]]; then
            echo "Select at least one store to deploy." >&2
            exit 1
          fi

  chrome:
    name: Chrome Web Store
    needs: validate-selection
    if: ${{ inputs.chrome }}
    uses: ./.github/workflows/deploy-chrome-store.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  firefox:
    name: Firefox Add-ons
    needs: validate-selection
    if: ${{ inputs.firefox }}
    uses: ./.github/workflows/deploy-firefox-amo.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  edge:
    name: Microsoft Edge Add-ons
    needs: validate-selection
    if: ${{ inputs.edge }}
    uses: ./.github/workflows/deploy-edge-addons.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  apple:
    name: Apple App Store Connect
    needs: validate-selection
    if: ${{ inputs.apple }}
    uses: ./.github/workflows/deploy-apple-app-store.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
