name: Set up go-webext
description: Install the pinned go-webext release used by store deployments

inputs:
  version:
    description: go-webext release tag
    required: true

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.26.x'
        cache: false
    - name: Install go-webext
      shell: bash
      env:
        GO_WEBEXT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        go install "github.com/adguardteam/go-webext@${GO_WEBEXT_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
